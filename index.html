/* ===== Donjon et entraînement ===== */
/* Construit les salles d'un donjon. Si les questions de la notion portent un champ
   "tier" (palier de difficulté, 1, 2, 3...), chaque palier devient sa propre salle,
   dans l'ordre, et une dernière salle "Résumé" est ajoutée automatiquement en
   mélangeant tous les paliers. Sans "tier", on garde l'ancien découpage automatique
   en 2 ou 3 salles à peu près égales, pour ne rien casser sur le contenu existant. */
const ROOM_CAP = 4;
function construireSalles(d){
  const tiers = {};
  d.questions.forEach(q => { if (q.tier != null) (tiers[q.tier] = tiers[q.tier] || []).push(q.id); });
  const tierKeys = Object.keys(tiers).map(Number).sort((a, b) => a - b);
  if (tierKeys.length){
    const labels = d.tierLabels || {};
    const rooms = tierKeys.map(t => ({ids:shuffle(tiers[t]).slice(0, Math.min(ROOM_CAP, tiers[t].length)), label:labels[t] || ("Salle " + t)}));
    const used = new Set(rooms.flatMap(r => r.ids));
    const rest = d.questions.map(q => q.id).filter(id => !used.has(id));
    const recapPool = shuffle(rest.length ? rest : d.questions.map(q => q.id));
    rooms.push({ids:recapPool.slice(0, Math.min(ROOM_CAP, recapPool.length)), label:"Résumé", recap:true});
    return rooms;
  }
  const total = Math.min(DUNGEON_LEN, d.questions.length);
  const ids = shuffle(d.questions.map(q => q.id)).slice(0, total);
  const bounds = limitesEtapePour(total);
  const rooms = []; let prev = 0;
  bounds.forEach((b, i) => { rooms.push({ids:ids.slice(prev, b), label:"Salle " + (i + 1)}); prev = b; });
  return rooms;
}
function creerSalle(dId, ids, label, recap, mobs, mobStart){
  return {ids, label, recap:!!recap, defeated:0, total:ids.length,
    queue:ids.map((qid, k) => ({d:dId, q:qid, mob:mobs[(mobStart + k) % mobs.length]}))};
}
function demarrerDonjon(dId){
  const d = DMAP[dId].d;
  const mobs = shuffle(MOBS);
  const defs = construireSalles(d);
  let mi = 0;
  const rooms = defs.map(rd => { const r = creerSalle(dId, rd.ids, rd.label, rd.recap, mobs, mi); mi += rd.ids.length; return r; });
  R = {mode:"dungeon", dId, lvl:d.req, rooms, roomIndex:0,
       correct:0, wrong:0, combo:0, maxCombo:0, hpMax:maxHp(), hp:maxHp(), qtimeBonus:0, xp:0, gold:0, cur:null, fb:null,
       stagePending:null, log:[], logStageStart:0};
  preparerQuestion(); allerA("dungeon");
}
function questionsDisponibles(){
  const out = [];
  SUBJECTS.forEach(s => s.dungeons.forEach(d => {
    if (estDebloque(d) || (S.dungeons[d.id] || {}).cleared) d.questions.forEach(q => out.push({d:d.id, q:q.id}));
  }));
  return out;
}
function demarrerEntrainement(){
  const avail = questionsDisponibles();
  if (!avail.length) return;
  const key = x => x.d + ":" + x.q;
  const mist = avail.filter(x => S.mistakes[key(x)]).sort((a, b) => S.mistakes[key(b)] - S.mistakes[key(a)]).slice(0, 5);
  const rest = shuffle(avail.filter(x => !mist.includes(x))).slice(0, 8 - mist.length);
  const list = shuffle([...mist, ...rest]);
  const mobs = ["🎯", "Mannequin d’entraînement"];
  const room = {ids:list.map(x => x.q), label:"Entraînement", defeated:0, total:list.length,
    queue:list.map(x => ({d:x.d, q:x.q, mob:mobs}))};
  R = {mode:"training", dId:null, lvl:1, rooms:[room], roomIndex:0,
       correct:0, wrong:0, combo:0, maxCombo:0, hpMax:maxHp(), hp:maxHp(), qtimeBonus:0, xp:0, gold:0, cur:null, fb:null, log:[], logStageStart:0};
  preparerQuestion(); allerA("dungeon");
}
/* Chrono de 6 s : uniquement sur la toute dernière salle d'un donjon, juste
   avant le boss — pas sur les autres salles, pas en entraînement. Une réponse
   non donnée à temps compte comme une erreur normale (pas de renvoi à zéro,
   contrairement à l'Épreuve du Système). */
const QTIME = 6000;
let QTIMER = null;
function estSalleChronometree(){ return R && R.mode === "dungeon" && R.roomIndex === R.rooms.length - 1; }
function preparerQuestion(){
  clearTimeout(QTIMER); QTIMER = null;
  const e = R.rooms[R.roomIndex].queue[0];
  const q = DMAP[e.d].qmap[e.q];
  R.cur = {e, q, order:q.c ? shuffle(q.c.map((_, i) => i)) : null};
  R.fb = null;
  if (estSalleChronometree()){
    QTIMER = setTimeout(() => {
      if (!R || R.fb) return;
      resoudreReponse(false, null, R.cur.q.c ? null : "");
    }, QTIME + (R.qtimeBonus || 0));
  }
}
function utiliserDilatationTemps(){
  if (!R || !estSalleChronometree() || R.fb) return;
  if (!(S.inv.potTime > 0)) return;
  S.inv.potTime--; R.qtimeBonus = (R.qtimeBonus || 0) + 3000;
  clearTimeout(QTIMER);
  QTIMER = setTimeout(() => {
    if (!R || R.fb) return;
    resoudreReponse(false, null, R.cur.q.c ? null : "");
  }, QTIME + R.qtimeBonus);
  sauvegarder(); afficher();
}
function utiliserSecondeChance(){
  if (!R || !R.fb || R.fb.ok || !estSalleChronometree()) return;
  if (!(S.inv.potSecond > 0)) return;
  S.inv.potSecond--;
  const room = R.rooms[R.roomIndex];
  const {e} = R.cur, qid = e.d + ":" + e.q;
  room.queue.unshift(room.queue.pop());
  R.wrong = Math.max(0, R.wrong - 1);
  S.total.wrong = Math.max(0, S.total.wrong - 1);
  if (S.mistakes[qid]){ S.mistakes[qid]--; if (S.mistakes[qid] <= 0) delete S.mistakes[qid]; }
  R.hp = Math.min(R.hpMax, R.hp + (R.fb.dmg || 0));
  R.log.pop();
  sauvegarder();
  preparerQuestion(); afficher();
}
function precisionDonjon(){ const n = R.correct + R.wrong; return n ? R.correct / n : 0; }
/* Découpe un donjon en 2 ou 3 "salles" à peu près égales.
   Retourne les seuils cumulés de créatures vaincues marquant la fin de chaque salle,
   ex. pour 8 créatures : [3, 6, 8]. */
function limitesEtapePour(total){
  const n = total <= 4 ? 2 : 3;
  const base = Math.floor(total / n), rem = total % n;
  const bounds = []; let acc = 0;
  for (let i = 0; i < n; i++){ acc += base + (i < rem ? 1 : 0); bounds.push(acc); }
  return bounds;
}
function etatsEtapes(){
  return R.rooms.map((room, i) => i < R.roomIndex ? "done" : i === R.roomIndex ? "current" : "locked");
}
function barreEtape(){
  const states = etatsEtapes();
  let html = '<div class="stagebar" role="img" aria-label="Progression dans le donjon : salle '
    + (R.roomIndex + 1) + ' sur ' + R.rooms.length + '">';
  R.rooms.forEach((room, i) => {
    const st = states[i], within = st === "done" ? room.total : room.defeated;
    html += `<div class="stage ${st}"><span class="stagenum">${st === "done" ? "✓" : i + 1}</span>
      <span class="stagesub">${Array.from({length:room.total}, (_, j) => `<i class="${j < within ? "on" : ""}"></i>`).join("")}</span>
      <span class="stagelbl">${esc(room.label || "Salle " + (i + 1))}</span></div>
      <span class="stagesep ${st === "done" ? "on" : ""}"></span>`;
  });
  html += `<div class="stage boss ${states[states.length - 1] === "done" ? "current" : "locked"}"><span class="stagenum">🗡️</span><span class="stagelbl">Boss</span></div>`;
  return html + "</div>";
}
function ecranEtapeReussie(){
  const d = DMAP[R.dId].d, i = R.stagePending, left = R.rooms.length - i - 1;
  const entries = R.log.slice(R.logStageStart);
  const okN = entries.filter(x => x.ok).length, koN = entries.length - okN;
  const recap = `<div class="recap">
      <div class="recaphead"><span class="rok">✓ ${okN} bonne${okN > 1 ? "s" : ""} réponse${okN > 1 ? "s" : ""}</span><span class="rko">✗ ${koN} erreur${koN > 1 ? "s" : ""}</span></div>
      <ul class="recaplist">${entries.map(x => `<li class="${x.ok ? "ok" : "ko"}"><span class="ic">${x.ok ? "✓" : "✗"}</span><div><span class="qt">${esc(x.text)}</span>${x.ok ? "" : `<span class="ca">Bonne réponse : ${esc(x.correct)}</span>`}</div></li>`).join("")}</ul>
    </div>`;
  return `<div class="dungeon">
    <div class="dtop"><div class="dtitle">${d.name}<small>${DMAP[d.id].s.name}</small></div></div>
    ${barreEtape()}
    <div class="win center-win" style="margin-top:6px;text-align:center">
      <div class="win-head" style="justify-content:center">${esc(R.rooms[i].label || "Salle " + (i + 1))} franchie</div>
      <h2>${left > 0 ? (left > 1 ? "Encore " + left + " salles avant le boss" : "Une dernière salle avant le boss") : "Toutes les salles sont franchies"}</h2>
      ${recap}
      <button class="btn primary big" data-act="stagecontinue">${left > 0 ? "Entrer dans la salle suivante" : "Vers la salle du boss"}</button>
    </div>
  </div>`;
}
function resoudreReponse(ok, pick, typed, defInfo){
  if (!R || R.fb) return;
  clearTimeout(QTIMER); QTIMER = null;
  const room = R.rooms[R.roomIndex];
  const {e, q} = R.cur, qid = e.d + ":" + e.q;
  const goodText = choiceText(q.c ? q.c[0] : (q.def || q.t[0]));
  const pickedText = ok ? goodText : (q.c ? (pick != null ? choiceText(q.c[R.cur.order[pick]]) : "(temps écoulé)") : (typed || "(pas de réponse)"));
  R.log.push({text:q.q, ok, correct:goodText, picked:pickedText});
  if (ok){
    R.correct++; R.combo++; R.maxCombo = Math.max(R.maxCombo, R.combo); room.defeated++;
    room.queue.shift();
    // Un donjon déjà terminé peut être rejoué pour réviser, mais ne rapporte
    // plus d'XP : seul du contenu neuf fait progresser en rang.
    const alreadyCleared = R.mode === "dungeon" && (S.dungeons[R.dId] || {}).cleared;
    const xpBase = R.mode === "training" ? 5 : 8 + R.lvl * 2;
    const goldBase = R.mode === "training" ? 3 : 5 + R.lvl;
    // Les Fondamentaux ne font pas encore progresser en niveau : le chasseur
    // est toujours "non classé" tant qu'il ne les a pas terminés.
    const xp = alreadyCleared ? 0 : xpBase;
    const gold = alreadyCleared ? Math.max(1, Math.round(goldBase * 0.25)) : goldBase;
    R.xp += xp; R.gold += gold; S.gold += gold;
    S.total.correct++; S.daily.correct++;
    if (S.mistakes[qid]){ S.mistakes[qid]--; if (S.mistakes[qid] <= 0) delete S.mistakes[qid]; }
    R.fb = {ok:true, pick, typed, xp, gold, defInfo};
    gagnerXP(xp);
  } else {
    R.wrong++; R.combo = 0; S.total.wrong++;
    S.mistakes[qid] = (S.mistakes[qid] || 0) + 1;
    const dmg = R.mode === "training" ? 0 : Math.max(4, 12 + R.lvl * 2 - defVal());
    R.hp = Math.max(0, R.hp - dmg);
    room.queue.push(room.queue.shift());
    R.fb = {ok:false, pick, typed, dmg, defInfo};
  }
  sauvegarder(); afficher();
}
function questionSuivante(){
  if (!R) return;
  if (R.hp <= 0){ UI.result = {type:"faint", dId:R.dId}; R = null; allerA("result"); return; }
  const room = R.rooms[R.roomIndex];
  if (!room.queue.length){
    if (R.mode === "dungeon" && R.stagePending === null){ R.stagePending = R.roomIndex; afficher(); return; }
    if (R.mode === "training"){
      S.daily.trainings++;
      UI.result = {type:"training", correct:R.correct, wrong:R.wrong, xp:R.xp, gold:R.gold};
      R = null; sauvegarder(); allerA("result");
    }
    return;
  }
  preparerQuestion(); afficher();
}
function boirePotionDonjon(id){
  if (!R || !(S.inv[id] > 0) || R.hp >= R.hpMax) return;
  S.inv[id]--; R.hp = Math.min(R.hpMax, R.hp + item(id).heal); sauvegarder(); afficher();
}

/* ===== Combat de boss, au tour par tour =====
   Déroulé : le joueur choisit une action (attaque, compétence, esquive ou potion),
   une courte animation se joue, puis c'est au tour du boss d'attaquer, avant de
   redonner la main au joueur. B.turn vaut "player" (boutons actifs) ou "busy"
   (une animation est en cours, les boutons sont désactivés). */
/* ===== Tempéraments de boss =====
   Déterminé uniquement par l'identifiant du donjon (seed stable) : un même
   boss se comporte toujours pareil, mais deux boss différents se jouent
   différemment, sans rien à configurer à la main dans les fichiers de
   contenu. */
const TEMPERAMENTS = {
  brute:{icon:"💢", label:"Brute"},
  insaisissable:{icon:"💨", label:"Insaisissable"},
  gardien:{icon:"🛡️", label:"Gardien"},
  vampirique:{icon:"🩸", label:"Vampirique"}
};
function temperamentBoss(dId){
  const keys = Object.keys(TEMPERAMENTS);
  return keys[hacherTexte(dId + ":temper") % keys.length];
}
function niveauArme(){ return +((S.weapon || "w0").slice(1)) || 0; }
function niveauArmure(){ return +((S.armor || "a0").slice(1)) || 0; }
/* ===== Chefs des Veilleurs Noirs =====
   Tous les boss du jeu appartiennent aux Veilleurs Noirs ; certains sont de
   simples sentinelles, d'autres sont des chefs porteurs d'un fragment de la
   Clé. C'est un choix éditorial (champ boss.chief:true dans le fichier de
   contenu du donjon concerné), jamais tiré au hasard. */
function estChef(d){ return !!(d && d.boss && d.boss.chief); }
/* Nombre total de fragments pour reconstituer la Clé ancestrale — à ajuster
   si le nombre de donjons "chef" prévus dans l'histoire change. */
const TOTAL_KEY_FRAGMENTS = 8;
function htmlProgressionCle(){

function demarrerBoss(dId, bless){
  const d = DMAP[dId].d, L = d.req;
  const chief = estChef(d);
  const hpStart = bless.hp !== undefined ? bless.hp : maxHp();
  const temper = temperamentBoss(dId);
  B = {dId, L, temper, chief,
       bossMax:Math.round((150 + L * 55) * (chief ? 1.8 : 1)),
       bossHp:Math.round((150 + L * 55) * (chief ? 1.8 : 1)),
       bossAtk:Math.round((9 + L * 3) * (chief ? 1.3 : 1)),
       hpMax:maxHp(), hp:Math.max(1, hpStart), mpMax:maxMp(), mp:maxMp(),
       mult:1 + bless.acc * 0.5, bless, perfectStreak:0, lastZone:null, playerTurns:0,
       usedSecond:false, usedTime:false, timeBoost:false, missPending:null,
       specialIn:temper === "brute" ? 3 : 2 + Math.floor(Math.random() * 3), specialNext:false,
       counter:false, enraged:false, over:false, turn:"player", anim:null, fx:[],
       log:[{text:"Le combat commence.", cls:"systeme"}]};
  UI.screen = "boss"; window.scrollTo(0, 0); afficher();
}
function ajouterJournal(text, cls){ B.log.push({text, cls}); if (B.log.length > 40) B.log.shift(); }
function verifierFinTour(){
  if (B.bossHp <= 0){ victoireBoss(); return true; }
  if (B.hp <= 0){ defaiteBoss(); return true; }
  return false;
}
function actionBoss(a){
  if (a === "hit"){ resoudreJauge(); return; }
  if (a === "secondtry"){ bossUtiliserSecondeChance(); return; }
  if (a === "keepmiss"){ bossGarderRate(); return; }
  if (!B || B.over || B.turn !== "player" || UI.screen !== "boss" || !$("#sys").hidden || B.timing || B.missPending) return;
  if (a === "dodge"){ esquiveJoueur(); return; }
  if (a === "pot"){ potionJoueur(); return; }
  if (a === "dilate"){ bossUtiliserDilatation(); return; }
  const spec = {atk:{m:1, mp:0}, s1:{m:3, mp:10}, s2:{m:6, mp:25}}[a];
  if (!spec) return;
  if (a === "s2" && S.level < 5) return;
  if (B.mp < spec.mp) return;
  demarrerJauge(a, spec);
}
function bossUtiliserSecondeChance(){
  if (!B || !B.missPending || S.inv.potSecond <= 0 || B.usedSecond) return;
  S.inv.potSecond--; B.usedSecond = true;
  const {name, spec} = B.missPending; B.missPending = null;
  ajouterJournal("Tu utilises Seconde Chance : la frappe est à retenter.", "me");
  sauvegarder();

}
function bossGarderRate(){
  if (!B || !B.missPending) return;
  const {name, spec} = B.missPending; B.missPending = null;
  attaqueJoueur(name, spec, "miss");
}
function bossUtiliserDilatation(){
  if (!B || B.timeBoost || S.inv.potTime <= 0 || B.usedTime || B.turn !== "player") return;
  S.inv.potTime--; B.usedTime = true; B.timeBoost = true;
  ajouterJournal("Tu actives la Dilatation du Temps : ta prochaine frappe sera ralentie.", "me");
  afficher(); sauvegarder();
}
/* Jauge de précision : un curseur fait l'aller-retour sur une barre, le
   joueur doit "Frapper" au bon moment. Plus le donjon est élevé, plus la
   jauge va vite et plus les zones se resserrent — le combat ne se résume
   plus à enchaîner des coups garantis à 100%. */
function demarrerJauge(name, spec){
  const comboBonus = B.bless.maxCombo >= 5 ? 2 : 0; // un bon combo en donjon élargit un peu la zone parfaite
  const wBonus = niveauArme() * 1.3;                 // une meilleure arme élargit la zone parfaite
  let half = Math.max(4, 9 - B.L * 0.35) + comboBonus + wBonus;  // demi-largeur de la zone "parfait"
  let goodHalf = Math.max(13, 28 - B.L * 0.7);                    // demi-largeur de la zone "réussi"
  let period = Math.max(500, 1050 - B.L * 22);                    // durée d'une moitié d'aller-retour (ms)
  // La difficulté grimpe pendant le combat, selon les PV du boss (jamais au hasard).
  const hpPct = B.bossHp / B.bossMax;
  if (hpPct <= 0.3){ period *= 0.72; half = Math.max(3, half - 2); goodHalf = Math.max(10, goodHalf - 4); }
  else if (hpPct <= 0.6){ period *= 0.86; half = Math.max(3.5, half - 1); goodHalf = Math.max(11, goodHalf - 2); }
  // Tempérament insaisissable : jauge plus rapide, zone décentrée (jamais pile au milieu).
  let offset = 0;
  if (B.temper === "insaisissable"){
    period *= 0.8;
    offset = (hacherTexte(B.dId + ":off:" + B.playerTurns) % 2 === 0 ? -1 : 1) * (8 + B.L * 0.4);
  }
  // Dilatation du Temps : ralentit nettement ce tir précis, une fois par combat.
  if (B.timeBoost){ period *= 1.6; B.timeBoost = false; }
  B.timing = {name, spec, start:performance.now(), period, half, goodHalf, offset};
  afficher();
}
function resoudreJauge(){
  if (!B || !B.timing || B.turn !== "player") return;
  const t = B.timing;
  const elapsed = (performance.now() - t.start) % (t.period * 2);
  const phase = elapsed / t.period;
  const pos = phase <= 1 ? phase * 100 : (2 - phase) * 100;
  const dist = Math.abs(pos - (50 + t.offset));
  const zone = dist <= t.half ? "perfect" : dist <= t.goodHalf ? "good" : "miss";
  if (zone === "miss" && S.inv.potSecond > 0 && !B.usedSecond){
    B.missPending = {name:t.name, spec:t.spec};
    B.timing = null;
    afficher();
    return;
  }
  B.timing = null;
  attaqueJoueur(t.name, t.spec, zone);
}
function attaqueJoueur(name, spec, zone){
  B.mp -= spec.mp;
  B.lastZone = zone;
  const mult = {perfect:1.6, good:1, miss:0.35}[zone || "good"];
  let dmg = atkVal() * spec.m * B.mult * rnd(0.9, 1.1) * mult;
  if (B.counter){ dmg *= 2; B.counter = false; }
  dmg = Math.max(1, Math.round(dmg));

  // Le boss peut esquiver — plus probable s'il est insaisissable, bien moins probable si ton tir était parfait.
  let bossDodgeChance = 6 + B.L * 0.6 + (B.temper === "insaisissable" ? 10 : 0);
  if (zone === "perfect") bossDodgeChance *= 0.4;
  const bossDodged = Math.random() * 100 < bossDodgeChance;
  // Le Gardien se protège un tour sur quatre.
  const shielded = !bossDodged && B.temper === "gardien" && B.playerTurns % 4 === 3;
  const applied = bossDodged ? 0 : shielded ? Math.round(dmg * 0.25) : dmg;
  B.bossHp = Math.max(0, B.bossHp - applied);
  B.playerTurns++;

  const label = {atk:"Attaque", s1:"Entaille", s2:"Frappe de l’ombre"}[name];
  ajouterJournal(bossDodged ? `Tu utilises ${label} : le boss esquive !`
    : shielded ? `Tu utilises ${label} : bloqué par son bouclier, ${applied} dégâts seulement.`
    : `Tu utilises ${label} : ${{perfect:"coup parfait, ", good:"", miss:"coup imprécis, "}[zone || "good"]}${applied} dégâts.`, "me");

  const extraFx = [];
  // Série de coups parfaits : le 3e déclenche un coup fatal gratuit.
  if (zone === "perfect") B.perfectStreak = (B.perfectStreak || 0) + 1;
  else if (zone) B.perfectStreak = 0;
  let fatal = 0;
  if (B.perfectStreak >= 3 && B.bossHp > 0){
    fatal = Math.max(1, Math.round(atkVal() * 1.8 * B.mult));
    B.bossHp = Math.max(0, B.bossHp - fatal);
    B.perfectStreak = 0;
    ajouterJournal(`Série de 3 coups parfaits : coup fatal, ${fatal} dégâts supplémentaires !`, "systeme");
    extraFx.push({text:"COUP FATAL ! +" + fatal, cls:"crit", x:40 + Math.random() * 16, y:30 + Math.random() * 8});
  }
  B.anim = {actor:"hero", kind:"attack", bossDodged, shielded, fatal:fatal > 0};
  const fxText = bossDodged ? "Esquivé !" : shielded ? "Bouclier !" : (zone === "perfect" ? "Parfait ! " : zone === "miss" ? "Raté… " : "") + applied;
  const fxCls = bossDodged || shielded ? "info" : zone === "perfect" ? "crit" : zone === "miss" ? "meh" : "hurt";
  B.fx = [{text:fxText, cls:fxCls, x:44 + Math.random() * 14, y:14 + Math.random() * 10}, ...extraFx];
  if (!B.enraged && B.bossHp > 0 && B.bossHp <= B.bossMax * 0.3){ B.enraged = true; ajouterJournal("Le boss entre en rage !", "systeme"); }
  B.turn = "busy"; afficher(); sauvegarder();
  setTimeout(() => {
    B.anim = null; B.fx = [];
    if (verifierFinTour()) return;
    afficher();
    setTimeout(tourBoss, 450);
  }, 650);
}
function esquiveJoueur(){
  ajouterJournal("Tu te prépares à esquiver.", "me");
  B.turn = "busy"; afficher();
  setTimeout(() => tourBoss(true), 400);
}
function potionJoueur(){
  const id = (S.inv.potHpL > 0 && B.hpMax - B.hp > 60) ? "potHpL" : (S.inv.potHp > 0 ? "potHp" : (S.inv.potHpL > 0 ? "potHpL" : null));
  if (!id || B.hp >= B.hpMax) return;
  S.inv[id]--; const heal = Math.min(B.hpMax - B.hp, item(id).heal); B.hp += heal;
  ajouterJournal(`Tu bois ${item(id).name.toLowerCase()} : +${heal} PV.`, "me");
  B.anim = {actor:"hero", kind:"heal"};
  B.fx = [{text:"+" + heal + " PV", cls:"good", x:40 + Math.random() * 18, y:66 + Math.random() * 10}];
  B.turn = "busy"; afficher(); sauvegarder();
  setTimeout(() => {
    B.anim = null; B.fx = [];
    afficher();
    setTimeout(tourBoss, 450);
  }, 600);
}
function tourBoss(playerDodging){
  const special = B.specialNext;
  const dodged = !!playerDodging && Math.random() * 100 < dodgeChance() * (special ? 0.5 : 1);
  let dmg = 0;
  if (dodged){
    B.counter = true;
    ajouterJournal(special ? "Tu esquives de justesse l’attaque spéciale ! Ta prochaine attaque fera double dégâts."
      : "Tu esquives l’attaque ! Ta prochaine attaque fera double dégâts.", "systeme");
  } else {
    // L'armure amortit surtout les attaques spéciales.
    const armorReduction = special ? Math.max(0.4, 1 - niveauArmure() * 0.06) : 1;
    dmg = Math.max(2, Math.round((B.bossAtk - defVal()) * (B.enraged ? 1.25 : 1) * (special ? 2.2 : 1) * armorReduction * rnd(0.9, 1.1)));
    B.hp = Math.max(0, B.hp - dmg);
    ajouterJournal(special ? `${DMAP[B.dId].d.boss.name} déchaîne son attaque spéciale : −${dmg} PV !`
      : `${DMAP[B.dId].d.boss.name} attaque : −${dmg} PV.`, "foe");
    // Tempérament vampirique : se nourrit de ses coups, sauf si ta dernière frappe était parfaite.
    if (B.temper === "vampirique" && B.lastZone !== "perfect" && B.bossHp < B.bossMax){
      const heal = Math.max(1, Math.round(dmg * 0.4));
      B.bossHp = Math.min(B.bossMax, B.bossHp + heal);
      ajouterJournal(`${DMAP[B.dId].d.boss.name} se nourrit du coup : +${heal} PV.`, "foe");
    }
  }
  B.anim = {actor:"boss", dodged, special};
  B.fx = [dodged
    ? {text:"Esquive !", cls:"info", x:40 + Math.random() * 18, y:66 + Math.random() * 10}
    : {text:(special ? "💥 " : "") + "−" + dmg, cls:"hurt", x:40 + Math.random() * 18, y:66 + Math.random() * 10}];
  if (special){
    B.specialNext = false;
    B.specialIn = 2 + Math.floor(Math.random() * 3);
  } else {
    B.specialIn--;
    if (B.specialIn <= 0){
      B.specialNext = true;
      ajouterJournal(`${DMAP[B.dId].d.boss.name} se prépare à une attaque dévastatrice !`, "systeme");
    }
  }
  afficher(); sauvegarder();
  setTimeout(() => {
    B.anim = null; B.fx = [];
    if (verifierFinTour()) return;
    B.mp = Math.min(B.mpMax, B.mp + 10);
    B.turn = "player";
    afficher();
  }, 650);
}
function victoireBoss(){
  B.over = true;
  const d = DMAP[B.dId].d, rec = S.dungeons[d.id] || {};
  const first = !rec.cleared, acc = B.bless.acc;
  const st = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1;
  const k = first ? 1 : 0.5;
  const xp = Math.round((40 + d.req * 20) * (B.chief ? 1.5 : 1) * k), gold = Math.round((30 + d.req * 15) * (B.chief ? 1.5 : 1) * k);
  let loot = null;
  if (Math.random() < 0.5){ const id = d.req >= 5 && Math.random() < 0.5 ? "potHpL" : "potHp"; S.inv[id] = (S.inv[id] || 0) + 1; loot = item(id).name.toLowerCase(); }
  let fragment = false;
  if (B.chief && first){ S.keyFragments = (S.keyFragments || 0) + 1; fragment = true; }
  if (first) S.codex[d.id] = {name:d.boss.name, icon:d.boss.icon, chief:!!B.chief, temper:B.temper};
  S.dungeons[d.id] = {cleared:true, stars:Math.max(st, rec.stars || 0), best:Math.max(acc, rec.best || 0)};
  S.gold += gold; S.daily.bosses++; S.total.bosses++;
  UI.result = {type:"win", dId:d.id, stars:st, acc, xp, gold, loot, first, chief:B.chief, fragment};
  R = null; gagnerXP(xp); sauvegarder();
  ajouterJournal("Victoire !", "systeme"); afficher();
  setTimeout(() => allerA("result"), 700);
}
function defaiteBoss(){
  B.over = true;
  UI.result = {type:"lose", dId:B.dId, left:Math.max(1, Math.round(B.bossHp / B.bossMax * 100)), bless:{acc:B.bless.acc, maxCombo:B.bless.maxCombo}};
  sauvegarder();
  ajouterJournal("Défaite…", "systeme"); afficher();
  setTimeout(() => allerA("result"), 700);
}

    return;
  }
  if (UI.screen === "intro" && e.key === "Enter" && e.target.id === "hn"){ e.preventDefault(); ACTIONS.start(); return; }
  if (UI.screen === "dungeon" && R && !R.fb){
    if (e.target.id === "ansIn" && e.key === "Enter" && e.target.tagName !== "TEXTAREA"){ e.preventDefault(); ACTIONS.submit(); return; }
    if (R.cur.q.c && /^[1-4]$/.test(e.key) && e.target.tagName !== "INPUT"){
      const i = +e.key - 1;
      if (i < R.cur.order.length){ e.preventDefault(); resoudreReponse(R.cur.order[i] === 0, i); }
    }
  }
});

/* ===== Démarrage ===== */
S = chargerLocal();
if (!SUBJECTS.length){
  document.getElementById("app").innerHTML = '<div class="win center-win" style="margin-top:20vh"><div class="win-head">Système</div><h2>Portails introuvables</h2><p>Le contenu des cours est absent ou mal écrit dans ce fichier.</p><p class="hint">Ta progression n’est pas touchée.</p></div>';
} else {
  if (S){ assurerQuotidienne(); UI.screen = "map"; }
  afficher();
  if (S){ verifierNouveauContenu(); sauvegarder(); }
}
/* Prévient d'une mise à jour de l'app — entièrement automatique, rien à
   changer à la main à chaque déploiement. On surveille index.html ET tous
   les fichiers de contenu (déduits directement des balises <script src=...>
   de la page, donc un futur fichier de matière est suivi sans rien changer
   ici) : pour chacun, on compare l'ETag (ou, à défaut, la date de dernière
   modification) renvoyée par le serveur à la dernière valeur vue sur cet
   appareil. Le message apparaît si NE SERAIT-CE QU'UN SEUL de ces fichiers
   a changé — un nouveau donjon ajouté dans un fichier de matière déclenche
   donc le message tout autant qu'une modification du moteur. Ne s'affiche
   jamais au tout premier lancement, et reste silencieux hors ligne ou si le
   serveur ne fournit aucune de ces deux informations pour aucun fichier. */
if (typeof fetch === "function"){
  const watchedFiles = ["index.html", ...[...document.querySelectorAll("script[src]")].map(s => s.getAttribute("src"))];
  Promise.all(watchedFiles.map(f =>
    fetch(f, {method:"HEAD", cache:"no-store"})
      .then(res => res.headers.get("etag") || res.headers.get("last-modified") || "")
      .catch(() => "")
  )).then(tags => {
    if (!tags.some(Boolean)) return; // aucune info exploitable pour aucun fichier
    const combined = tags.join("|");
    const VKEY = "eveil-chasseur-version";
    const last = localStorage.getItem(VKEY);
    if (last && last !== combined){
      systeme("Mise à jour installée", "<p>Une nouvelle version du Système vient d’être téléchargée.</p>", null, "info");
    }
    localStorage.setItem(VKEY, combined);
  });
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if (S && S.total.correct >= 10 && Date.now() - (S.lastBackup || 0) > 7 * 864e5)
  systeme("Pense à ta sauvegarde", "<p>Ça fait un moment que tu n’as pas mis ta progression à l’abri.</p><p>Va dans <strong>Statut</strong>, puis <strong>Sauvegarde</strong>.</p>");
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
